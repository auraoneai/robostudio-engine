[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robostudio-engine"
version = "0.1.1"
description = "Inspect, index, QA, cluster, probe, and export robotics datasets from a headless CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AuraOne", email = "opensource@auraone.ai" }]
keywords = [
  "dataset-inspection",
  "hdf5",
  "lerobot",
  "openx",
  "rlds",
  "robotics",
  "rosbag",
  "vla",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Robotics",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
hdf5 = ["h5py>=3.10"]
hf = ["huggingface_hub>=0.23"]
ml = ["hdbscan>=0.8.33", "numpy>=1.24", "pillow>=10", "torch>=2", "transformers>=4.40"]
trust = [
  "embodiment-card>=0.1.1",
  "failure-gallery>=0.2.1",
  "lerobot-quality-gates>=0.1.6",
  "robot-recovery-bench>=0.1.1",
  "vla-robustness-kit>=0.1.1",
]
build = ["build>=1.2"]

[project.urls]
Homepage = "https://auraone.ai/open/robotics-studio"
Source = "https://github.com/auraoneai/robostudio-engine"
Issues = "https://github.com/auraoneai/robostudio-engine/issues"
Documentation = "https://github.com/auraoneai/robostudio-engine#readme"
"Companion Tools" = "https://github.com/auraoneai/robostudio-engine/blob/main/README.md#companion-trust-tools"
Changelog = "https://github.com/auraoneai/robostudio-engine/blob/main/CHANGELOG.md"
Security = "https://github.com/auraoneai/robostudio-engine/security/policy"

[project.scripts]
robostudio = "robostudio_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["robostudio_engine*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
